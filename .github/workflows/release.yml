name: Release

# Run by hand (Actions > Release > Run workflow) or through the API.
# Builds, verifies, then publishes a release from the exact commit being tagged.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v2.1.1 (must not exist yet)"
        required: true
        type: string
      target:
        description: "Full 40-character commit SHA on main to tag"
        required: true
        type: string
      title:
        description: "Release title"
        required: true
        type: string
      notes:
        description: "Release notes (markdown)"
        required: true
        type: string
      latest:
        description: "Mark as the latest release"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
      LATEST: ${{ inputs.latest }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || fail "tag must look like v1.2.3"
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || fail "target must be a full 40-character commit SHA"
          git cat-file -e "$TARGET^{commit}" 2>/dev/null || fail "target $TARGET is not in this repository"
          git merge-base --is-ancestor "$TARGET" origin/main || fail "target $TARGET is not on main"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            fail "tag $TAG already exists"
          fi
          git checkout --detach "$TARGET"

      - name: Build and verify release assets
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          python -m pip install -e .
          python -m banking_v3 export-release \
            --out "$RUNNER_TEMP/dist" --tag "$TAG" --commit "$TARGET"
          python -m cleanroom_eval.contract verify-release \
            --manifest "$RUNNER_TEMP/dist/release-manifest.json" \
            --root "$RUNNER_TEMP/dist/tree"
          python - "$RUNNER_TEMP/dist/release-audit.json" "$TAG" "$TARGET" "$RUNNER_TEMP/dist/release-manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          audit_path = pathlib.Path(sys.argv[1])
          audit = json.loads(audit_path.read_text())
          expected = audit.pop("audit_sha256")
          actual = hashlib.sha256(json.dumps(audit, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          if expected != actual:
              raise SystemExit("release audit self-digest differs")
          if audit["release_tag"] != sys.argv[2] or audit["repository_commit"] != sys.argv[3]:
              raise SystemExit("release audit is not bound to the requested tag and commit")
          manifest = json.loads(pathlib.Path(sys.argv[4]).read_text())
          if manifest["release_tag"] != sys.argv[2] or manifest["repository_commit"] != sys.argv[3]:
              raise SystemExit("release manifest is not bound to the requested tag and commit")
          if audit["terminal_state"] not in ("RELEASE_AUDIT_PASS", "RELEASE_AUDIT_PASS_WITH_LIMITATIONS"):
              raise SystemExit("release audit is not publishable: " + audit["terminal_state"])
          if audit["not_run_gates"]:
              raise SystemExit("release audit has gates that did not run")
          PY
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/dist/release-notes.md"

      - name: Publish release
        run: |
          set -euo pipefail
          args=(--target "$TARGET" --title "$TITLE" --notes-file "$RUNNER_TEMP/dist/release-notes.md" --latest="$LATEST")
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          files=(
            "$RUNNER_TEMP/dist/cleanroom-eval-release.tar.gz"
            "$RUNNER_TEMP/dist/release-audit.json"
            "$RUNNER_TEMP/dist/release-manifest.json"
          )
          gh release create "$TAG" "${args[@]}" "${files[@]}"
          {
            echo "### Released $TAG at \`$TARGET\`"
            echo '```'
            (cd "$RUNNER_TEMP/dist" && sha256sum cleanroom-eval-release.tar.gz release-audit.json release-manifest.json)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
